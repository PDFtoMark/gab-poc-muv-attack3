name: PoC Mu Pr Validation Post

on:
  workflow_run:
    workflows: ["Mu QEMU PR Validation"]
    types: ["completed"]

permissions:
  contents: read
  actions: read

jobs:
  post-process:
    runs-on: ubuntu-latest
    steps:
      - name: Download PR Metadata from Triggering Run
        id: download-metadata
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mu-qemu-pr-metadata
          path: metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}

      - name: Probe Downloaded Metadata
        run: |
          echo "download outcome: ${{ steps.download-metadata.outcome }}"
          ls -la metadata || true
          echo '--- metadata content ---'
          cat metadata/pr-metadata.json || true

      - name: Parse PR Metadata
        if: steps.download-metadata.outcome == 'success'
        id: metadata
        shell: python3 {0}
        run: |
          import json
          import os
          import pathlib

          data = json.loads(pathlib.Path('metadata/pr-metadata.json').read_text(encoding='utf-8'))

          def write(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f"{name}={value}\n")

          write('pr_number', data.get('pr_number', ''))

      - name: Check PR State
        if: steps.download-metadata.outcome == 'success' && steps.metadata.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.metadata.outputs.pr_number }}');
            if (!prNumber) {
              core.setOutput('merged_or_closed', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('merged_or_closed', pr.state !== 'open' ? 'true' : 'false');
            core.info('PR state is ' + pr.state);
